<body>
    <h1>奥罗拉矿山安全考试</h1>
    <p>点击选项后，将实时显示是否正确。所有题目已去除英文，只保留中文。</p>

    <div id="questions"></div>

    <script>
        const questions = [
            { type: '单选', title: '人员上岗前，需：', options: ['可直接上岗', '参加培训并测试合格', '参加培训', '领导同意'], answer: 'B' },

            { type: '单选', title: '应在什么时候保持作业现场整洁', options: ['作业前', '作业中', '作业后', '时刻保持'], answer: 'D' },

            { type: '单选', title: '关于井下个人防护用品佩戴要求，正确的是', options: ['井下要求的个人防护用品和地表作业相同', '开车人员不需要佩戴个人防护用品', '需穿安全水鞋，戴口罩', '根据井下情况选择性携带自救器'], answer: 'C' },

            { type: '单选', title: '单次炸药量小于100公斤的掘进爆破警戒范围不得小于', options: ['200m', '400m', '600m', '撤离至地表'], answer: 'C' },

            { type: '单选', title: '当用爆破法贯通巷道，两掘进工作面间距小于20米时，应如何作业？', options: ['两面同时掘进', '先炸一面，后炸一面', '只允许一面掘进，且双方需设警戒', '不得爆破'], answer: 'C' },

            { type: '单选', title: '以下哪项行为不符合自救器的日常保管要求？', options: ['将自救器存放在干燥清洁处', '将自救器靠近热的物体上以便快速取用', '检查压力值是否合格', '避免接触油脂、燃料等腐蚀性物质'], answer: 'B' },
            { type: '单选', title: '使用压缩氧自救器逃生时，以下哪项是必须遵守的原则？', options: ['快速跑动，不必理会呼吸节奏', '保持镇定，选择最佳逃生路线', '跟着他人盲目行动', '先停下来测试设备再决定方向'], answer: 'B' },

            { type: '单选', title: '奥罗拉矿山井下易发生冒顶、片帮事故的主要原因是：', options: ['通风不畅', '地层为泥岩和砂岩，稳定性差，加之爆破影响', '地下水渗透', '采矿作业'], answer: 'B' },
            { type: '单选', title: '哪种情况下最可能引发井下水灾事故？', options: ['水泵线路完整', '地表排水设施遭破坏，暴雨期间地表水倒灌', '正常天气条件下进行作业', '地下水位稳定无异常'], answer: 'B' },

            { type: '单选', title: '如果冒顶片帮事故核实无伤亡，下一步应由谁宣布应急响应结束', options: ['安全员', '井下主管', '应急安全协调组', '矿山井下经理'], answer: 'D' },

            { type: '判断', title: '如果确认没有人员被困，事故区域可立即恢复作业。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '如果火灾发生在井下浅部区域，应由电工迅速使主风机转为反风模式。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '可以在避难所内吸烟', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '避难所中的设施只有在发生险情时才可使用，损坏或偷窃避难室中的设施，将会受到严肃的纪律处分。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '第一个到达避难所的人负责安排，直到有更高职位的人员到达。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '在认为外界没有危险后，可自行离开避难所。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '所有井下作业人员必须知道各个避难所和避难硐室的位置。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '避难所的位置是固定不变的。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '人员可以短暂的在没有通风的区域内通行或工作。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '在粉尘环境中作业可以不戴口罩，只要通风良好。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '替换风筒时，新风筒应尽量靠近风机，以确保通风效率最大化。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '机械维修人员有时由于工作需要可能要取下安全帽，但是不允许这样做。另外还要注意系好下颚护带。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '如果护耳装置在一分钟内被取下五秒，其保护效果仍然完全有效。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '有些地点尽管有护栏但在升高的工作平台上操作时，应该使用防止坠落的安全绳具', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '蓄有长发的人员在电力工具、滑轮及传送带附近工作时，应该带护发网。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '多名人员在同一设备上作业时，每人都应挂自己的危险标牌。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '任何时候各成员都必须听从小组长安排', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '成员离开工作区域须得到小组长同意', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '轻型车辆需要给所有重型车辆让道。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '在进入井口之前必须先检查车辆制动及对讲机系统，其中一项良好即可下井', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '重型车辆在转弯时需特别小心，以防人员或设备在未告知情况下进入其作业区域。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '当双向行驶卡车都是载重车辆时，最靠近让车硐室的卡车需要给对方车辆让道。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '轻型车辆需要停在重型设备后面时必须与前车保持30米以上距离，如果距离不够，轻型车辆司机必须通过对讲机告知前方重型设备司机。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '行人在未获得操作员确认之前，应始终假设自己未被看见。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '行人应从设备操作员所在一侧通过车辆。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '车辆可以随时在斜坡道所有区域以及任何岔道15米范围以内逗留', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '人工撬顶只适用于装药前对工作面的检撬', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '人工撬顶作业中，撬顶人员使用的撬棍越长越好，便于控制。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '当你敲击岩石时发出“呯呯”的声音，说明岩石是松动的并需要撬下。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '如果岩石顺着撬棍落下或砸向你时，用撬棍将岩石挑飞。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '撬顶作业在手握撬棍时，要使撬棍位于身体的侧面而不是前面，否则当岩石下落打向撬棍时会造成严重的或致命的伤害。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '开始作业前进行一次撬顶作业，后续作业中不需要再撬顶排险', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '井下水仓的淤泥每月清一次即可，无需每班巡检。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '在空洞附近工作时，只要穿戴标准PPE即可，无需使用安全带与防坠器。', options: ['正确', '错误'], answer: 'B' },
            { type: '判断', title: '在空洞上方距离空洞3米范围内作业时必须随时佩带防坠设备。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '预备（准备）手势为手臂伸直，置于头上方，五指自然伸开，手心朝前，保持不动。', options: ['正确', '错误'], answer: 'A' },
            { type: '判断', title: '下降手势为手臂向一侧水平伸直，拇指朝下，余指握拢，小臂向下摆动', options: ['正确', '错误'], answer: 'A' }
        ];

        const container = document.getElementById('questions');
        questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `
                <h3>${index + 1}. [${q.type}] ${q.title}</h3>
                <ul class="options">
                    ${q.options.map((opt, i) => {
                        const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
                        return `<li><span class="option-btn" data-answer="${letters[i]}" data-correct="${q.answer}">${letters[i]}. ${opt}</span></li>`;
                    }).join('')}
                </ul>
                <p class="feedback"></p>
            `;
            container.appendChild(div);
        });

        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const selected = e.target.dataset.answer;
                const correct = e.target.dataset.correct;
                const feedback = e.target.parentElement.parentElement.nextElementSibling;
                feedback.style.display = 'block';
                if (selected === correct) {
                    feedback.textContent = '正确！';
                    feedback.className = 'feedback correct';
                } else {
                    feedback.textContent = `错误！正确答案是 ${correct}`;
                    feedback.className = 'feedback incorrect';
                }
                // Disable other options in the same question
                const siblings = e.target.parentElement.parentElement.querySelectorAll('.option-btn');
                siblings.forEach(sib => sib.style.pointerEvents = 'none');
            });
        });
    </script>
</body>
</html>
